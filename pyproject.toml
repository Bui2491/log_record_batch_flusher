[project]
name = "log-record-batch-flusher"
version = "0.1.0"
description = "A logging.Handler that accumulates records and flushes them in batches on a timer or when capacity is reached, reducing I/O calls."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
